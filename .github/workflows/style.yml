name: Code Style

on:
  push:
    branches: [main, release-2.0]
    paths-ignore:
      - 'pretix_signature_capture/locale/**'
      - 'pretix_signature_capture/static/**'
  pull_request:
    branches: [main, release-2.0]
    paths-ignore:
      - 'pretix_signature_capture/locale/**'
      - 'pretix_signature_capture/static/**'

jobs:
  lint:
    name: Lint (isort, flake8, black, docformatter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      # Lint tools don't need pretix installed; isort's `known_third_party = pretix`
      # is a categorization hint, not an import requirement.
      - name: Install lint tools
        run: pip install isort flake8 black docformatter
      - name: Run isort
        run: isort -c .
      - name: Run flake8
        run: flake8 .
      - name: Run black
        run: black --check .
      - name: Run docformatter
        run: docformatter --check -r .

  packaging:
    name: Build & check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pkg-${{ hashFiles('**/pyproject.toml', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-pkg-
      - name: Install build tooling
        run: pip install build twine check-manifest
      - name: Run check-manifest
        run: check-manifest .
      - name: Build sdist + wheel
        run: python -m build
      - name: Check artifacts with twine
        run: twine check dist/*
