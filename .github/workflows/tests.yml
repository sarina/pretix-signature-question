name: Tests

on:
  push:
    branches: [main, release-2.0]
    paths-ignore:
      - 'pretix_signature_capture/locale/**'
  pull_request:
    branches: [main, release-2.0]
    paths-ignore:
      - 'pretix_signature_capture/locale/**'

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.python-version }}-
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Install pretix
        run: pip install pretix
      - name: Install plugin and test deps
        run: pip install pytest pytest-django pytest-cov -Ue .
      - name: Run tests
        run: pytest --cov=pretix_signature_capture tests
