[flake8]
ignore = N802,W503,E402
max-line-length = 88
exclude =
    .git,
    .venv,
    venv,
    env,
    .tox,
    .pytest_cache,
    .eggs,
    *.egg-info,
    migrations,
    .ropeproject,
    static,
    _static,
    build,
    dist

[isort]
combine_as_imports = true
default_section = THIRDPARTY
include_trailing_comma = true
known_third_party = pretix
known_standard_library = typing
multi_line_output = 3
skip = setup.py
skip_glob =
    .venv/*,
    venv/*,
    env/*,
    .eggs/*,
    *.egg-info/*,
    build/*,
    dist/*
use_parentheses = True
force_grid_wrap = 0
line_length = 88
known_first_party = pretix_signature_capture

[coverage:run]
source = pretix_signature_capture
omit = */migrations/*,*/urls.py,*/tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __str__
    der __repr__
    if settings.DEBUG
    NOQA
    NotImplementedError

[check-manifest]
ignore =
    .update-locales.sh
    .install-hooks.sh
    Makefile
    manage.py
    tests/*
