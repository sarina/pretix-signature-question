[project]
name = "pretix-signature-capture"
dynamic = ["version"]
description = "A pretix plugin that lets attendees draw a signature in response to a question."
readme = "README.rst"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["pretix", "signature", "waiver"]
authors = [
    {name = "Sarina Canelake", email = "scanelake@gmail.com"},
]
maintainers = [
    {name = "Sarina Canelake", email = "scanelake@gmail.com"},
]

dependencies = [

]

[project.entry-points."pretix.plugin"]
pretix_signature_capture = "pretix_signature_capture:PretixPluginMeta"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://github.com/sarina/pretix-signature-capture"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_signature_capture.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false

# docformatter has no built-in directory exclusions (unlike black), so it'll
# happily recurse into .venv if not told otherwise. `recursive = true` lets
# the Makefile drop the `-r` flag.
[tool.docformatter]
recursive = true
exclude = [
    ".venv",
    "venv",
    "env",
    ".eggs",
    "*.egg-info",
    "build",
    "dist",
    ".git",
]

# black's DEFAULT_EXCLUDES already covers .venv, venv, build, dist, etc., but
# we pin a target-version explicitly so contributors on different Python
# versions get consistent output.
[tool.black]
target-version = ["py311", "py312", "py313"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pretix.testutils.settings"
# Ignore warnings coming from site packages
filterwarnings = [
    "ignore:::pretix",
    "ignore:::django"
]
