[project]
name = "pretix-signature-capture"
dynamic = ["version"]
description = "A pretix plugin that lets attendees draw a signature in response to a question."
readme = "README.rst"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["pretix", "signature", "waiver"]
authors = [
    {name = "Sarina Canelake", email = "scanelake@gmail.com"},
]
maintainers = [
    {name = "Sarina Canelake", email = "scanelake@gmail.com"},
]

dependencies = [

]

[project.entry-points."pretix.plugin"]
pretix_signature_capture = "pretix_signature_capture:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools>=64",
    "pretix-plugin-build",
]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://github.com/sarina/pretix-signature-capture"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_signature_capture.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false
